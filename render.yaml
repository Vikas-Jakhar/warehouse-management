services:
  # Backend API & Celery Worker
  - type: web
    name: warehouse-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: warehouse-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: warehouse-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: warehouse-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: warehouse-redis
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENV
        value: production
      - key: CORS_ORIGINS
        value: "*"

  # Managed Redis
  - type: redis
    name: warehouse-redis
    ipAllowList: []
    plan: free
    region: oregon

  # Frontend Static Site
  - type: web
    name: warehouse-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://warehouse-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: warehouse-db
    databaseName: warehouse_db
    user: warehouse
    plan: free
    region: oregon
